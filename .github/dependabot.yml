# Mises à jour automatiques : actions GitHub (SHA épinglés + commentaire de version) et npm.
# Les PR Dependabot passent par le job « Porte qualité » comme toute PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-mineures:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
