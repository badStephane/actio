# Mises à jour automatiques : actions GitHub (SHA épinglés + commentaire de version) et npm.
# Les PR Dependabot passent par le job « Porte qualité » comme toute PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # npm : mensuel, au plus 2 PR par mois (mineures + correctifs groupés, majeures groupées).
  # La porte qualité filtre ; les majeures (React 19, Vite 8, jsdom 30, lucide 1.x...) se traitent
  # dans le chantier 2.2.0, hors release.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-mineures:
        update-types: [minor, patch]
      npm-majeures:
        update-types: [major]
    commit-message:
      prefix: chore
