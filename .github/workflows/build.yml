# CI et release d'Actio.
# - checks : porte qualité sur PR, push main et tags (bloque tout le reste).
# - build : installeurs signés, seulement sur tag v* ou lancement manuel. Aucun jeton d'écriture.
# - draft-release : release en BROUILLON + latest.json validé. Le parc ne voit rien tant que
#   la publication n'est pas faite par le workflow publish-release.yml (après smoke test, docs/RELEASE.md).
# Actions épinglées par SHA (Dependabot les met à jour), versions en commentaire.
name: CI et release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Porte qualité
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (historique et tags complets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.22.2 <23'  # node:sqlite sans drapeau (tests QA), jsdom 31 et vitest 5
          cache: npm

      - name: Vérifier Node (>= 22.13, node:sqlite)
        run: |
          node -e "require('node:sqlite'); console.log('Node ' + process.version + ', node:sqlite OK')"

      - name: Dernière release publiée
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [ -n "$TAG" ] || { echo "::error::aucune release publiée trouvée"; exit 1; }
          echo "Dernière release publiée : $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Garde-fou des migrations SQL
        env:
          PUBLISHED_TAG: ${{ steps.published.outputs.tag }}
        run: node scripts/check-migrations.mjs "$PUBLISHED_TAG"

      - name: Garde-fou de version (tags seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PUBLISHED_TAG: ${{ steps.published.outputs.tag }}
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME" "$PUBLISHED_TAG"

      - name: Tests des garde-fous
        run: node --test scripts/release-guards.test.mjs

      - name: Installer les dépendances npm
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Tests front
        run: npm test --if-present

      - name: Build web (requis par generate_context! de Tauri)
        run: npm run build

      - name: Dépendances système Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branche)
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          key: checks-linux

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.os_name }}
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
            rust_targets: ''
            tauri_args: ''
          - platform: macos-latest
            os_name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.22.2 <23'  # node:sqlite sans drapeau (tests QA), jsdom 31 et vitest 5
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branche)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os_name }}

      - name: Installer les dépendances npm
        run: npm ci

      # Seule étape qui voit les secrets de signature. Clé écrite dans un fichier temporaire,
      # supprimée à la sortie de l'étape. Rien n'est exporté vers GITHUB_ENV.
      - name: Build Tauri
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_ARGS: ${{ matrix.tauri_args }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/tauri-signing.key"
          trap 'rm -f "$KEY_PATH"' EXIT
          # Ne garder que les caractères base64 (retire espaces, CR, marqueur '%' de zsh).
          printf '%s' "$RAW_KEY" | LC_ALL=C tr -dc 'A-Za-z0-9+/=' > "$KEY_PATH"
          unset RAW_KEY
          [ -s "$KEY_PATH" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY vide"; exit 1; }
          chmod 600 "$KEY_PATH"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY_PATH"
          # shellcheck disable=SC2086 # TAURI_ARGS doit être découpé en mots
          npm run tauri:build -- $TAURI_ARGS

      - name: Rassembler les fichiers de release (échec si un fichier manque)
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$RUNNER_OS" = "Windows" ]; then
            B=src-tauri/target/release/bundle
            PATTERNS=("$B/nsis/*_${VERSION}_x64-setup.exe" "$B/nsis/*_${VERSION}_x64-setup.exe.sig")
          else
            B=src-tauri/target/universal-apple-darwin/release/bundle
            PATTERNS=("$B/dmg/*_${VERSION}_universal.dmg" "$B/macos/*.app.tar.gz" "$B/macos/*.app.tar.gz.sig")
          fi
          mkdir -p release-assets
          for PATTERN in "${PATTERNS[@]}"; do
            # shellcheck disable=SC2206 # expansion de glob voulue
            FOUND=( $PATTERN )
            [ "${#FOUND[@]}" -eq 1 ] || { echo "::error::attendu 1 fichier pour $PATTERN, trouvé ${#FOUND[@]}"; exit 1; }
            NAME=$(basename "${FOUND[0]}")
            # Espaces remplacés par des points : nom identique à celui que GitHub donnerait, mais déterministe.
            cp "${FOUND[0]}" "release-assets/${NAME// /.}"
          done
          ls -la release-assets

      - name: Publier les installeurs comme artefacts du run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Release brouillon et latest.json
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Récupérer les installeurs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Créer (ou reprendre) le brouillon
        run: |
          set -euo pipefail
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$IS_DRAFT" = "true" ] || { echo "::error::$TAG est déjà publiée : refus de la modifier"; exit 1; }
            echo "Brouillon $TAG existant, repris."
          else
            PRE=()
            [[ "$TAG" == *-* ]] && PRE=(--prerelease)
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Actio ${TAG#v}" "${PRE[@]}"
          fi

      - name: Construire et valider latest.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          one() {
            local found=( assets/$1 )
            [ "${#found[@]}" -eq 1 ] && [ -s "${found[0]}" ] || { echo "::error::attendu 1 fichier non vide assets/$1, trouvé ${#found[@]}" >&2; return 1; }
            echo "${found[0]}"
          }
          VERSION="${TAG#v}"
          BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          WIN=$(one '*_x64-setup.exe')
          MAC=$(one '*.app.tar.gz')
          WIN_SIG=$(cat "$(one '*_x64-setup.exe.sig')")
          MAC_SIG=$(cat "$(one '*.app.tar.gz.sig')")
          one '*.dmg' > /dev/null
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          [ -n "$NOTES" ] || NOTES="Actio $VERSION"
          jq -n \
            --arg v "$VERSION" --arg n "$NOTES" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wu "$BASE/$(basename "$WIN")" --arg ws "$WIN_SIG" \
            --arg mu "$BASE/$(basename "$MAC")" --arg ms "$MAC_SIG" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {
                "windows-x86_64": {url: $wu, signature: $ws},
                "darwin-aarch64": {url: $mu, signature: $ms},
                "darwin-x86_64":  {url: $mu, signature: $ms}}}' > latest.json
          jq -e --arg v "$VERSION" --arg base "$BASE/" '
            .version == $v and (.notes | length > 0) and
            ([.platforms[] | select((.url | startswith($base)) and (.url | length > ($base | length))
               and (.signature | test("^[A-Za-z0-9+/=]{40,}$")))] | length == 3)' latest.json > /dev/null \
            || { echo "::error::latest.json invalide (URL ou signature manquante)"; cat latest.json; exit 1; }
          cat latest.json

      - name: Attacher les fichiers au brouillon et vérifier
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* latest.json --clobber
          NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for URL in $(jq -r '.platforms[].url' latest.json) "x/latest.json"; do
            grep -qxF "$(basename "$URL")" <<< "$NAMES" || { echo "::error::asset $(basename "$URL") absent du brouillon"; exit 1; }
          done
          {
            echo "### Brouillon $TAG prêt"
            echo "1. Télécharger le setup.exe depuis le brouillon et faire le smoke test (docs/RELEASE.md)."
            echo "2. Publier : \`gh workflow run publish-release.yml -f tag=$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
